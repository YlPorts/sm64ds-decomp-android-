name: Android full-engine compile (not playable)
on:
  workflow_dispatch:
  push:
    branches: [android/native-bootstrap]
    paths: ['android/full-engine/**', '.github/workflows/android-full-engine.yml']
permissions:
  contents: read
jobs:
  compile-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SM64DS_LINK_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned NDK
        run: sdkmanager 'ndk;28.2.13676358'
      - name: Check inventory tool
        run: python3 -m unittest discover -s android/full-engine -p 'test_*.py' -v
      - name: Verify ARM ELF state layout and retained packed offsets
        shell: bash
        run: |
          LLVM="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python3 android/full-engine/test_elf_sections.py --clang "$LLVM/clang" --linker "$LLVM/ld.lld" --readelf "$LLVM/llvm-readelf"
      - name: Compile native call ABI tests for Android
        shell: bash
        run: |
          LLVM="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python3 android/full-engine/check_call_abi.py --compiler "$LLVM/armv7a-linux-androideabi23-clang++" --output build/call-abi-android
      - name: Compile native source and service tests for Android
        shell: bash
        run: |
          LLVM="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python3 android/full-engine/check_source_portability.py --cc "$LLVM/armv7a-linux-androideabi23-clang" --cxx "$LLVM/armv7a-linux-androideabi23-clang++" --output build/source-tests-android
      - name: Compile native audio, UDP and initializer tests for Android
        shell: bash
        run: |
          LLVM="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python3 android/full-engine/check_platform_backends.py --cxx "$LLVM/armv7a-linux-androideabi23-clang++" --output build/platform-tests-android
          # API 26 enables compile-time type comparisons against the NDK declarations.
          "$LLVM/armv7a-linux-androideabi26-clang++" -std=c++17 -O2 -pthread \
            -Iandroid/full-engine -Iport/hal/sdat -c android/full-engine/out_android.cpp \
            -o build/platform-tests-android/aaudio-api26-types.o
          "$LLVM/llvm-readelf" -d --dyn-syms build/platform-tests-android/audio_tests \
            > build/platform-tests-android/aaudio-linkage.txt
          python3 - <<'PYCHECK'
          import pathlib, re
          text = pathlib.Path('build/platform-tests-android/aaudio-linkage.txt').read_text()
          assert not re.search(r'\(NEEDED\).*libaaudio', text), 'AAudio must not be a required library'
          assert not re.search(r'\bUND\s+AAudio', text), 'AAudio must resolve only through checked dlsym'
          print('PASS: API-26 function types verified; API-23 ELF has no required AAudio library/symbol')
          PYCHECK
      - name: Resolve complete upstream game target, no ROM required
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/full-graph/.cmake/api/v1/query/client-android-engine
          touch build/full-graph/.cmake/api/v1/query/client-android-engine/codemodel-v2
          cmake -S port -B build/full-graph -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-23 \
            -DANDROID_STL=c++_static -DPORT_ROM_CLEAN=ON -DPORT_LINK_ONLY=ON
      - name: Compile resolved game translation units with native Android Clang
        shell: bash
        run: |
          set -o pipefail
          python3 android/full-engine/compile_inventory.py \
            --build build/full-graph --ndk "$ANDROID_HOME/ndk/28.2.13676358" \
            --target walk_window --output build/full-report --jobs 4 | tee full-engine.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-full-engine-compilation-report
          path: |
            full-engine.log
            build/full-report/*.json
            build/full-report/*.md
            build/full-report/*.log
            build/full-report/errors
            build/full-report/adapted
            build/full-report/call-abi
            build/full-report/source-ports
            build/source-tests-android
            build/platform-tests-android
            build/call-abi-android
            android
            .github/workflows/android*.yml
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  call-abi-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [arm, thumb]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ARM compiler and test runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-arm-linux-gnueabihf qemu-user
      - name: Run native virtual-call and aggregate-return tests
        shell: bash
        run: |
          set -o pipefail
          python3 android/full-engine/check_call_abi.py --compiler arm-linux-gnueabihf-g++ --flags="-m${{ matrix.mode }}" --runner="qemu-arm -L /usr/arm-linux-gnueabihf" --output build/call-abi | tee call-abi.log
      - name: Execute recovered-source and native service probes
        shell: bash
        run: |
          set -o pipefail
          python3 android/full-engine/check_source_portability.py --cc arm-linux-gnueabihf-gcc --cxx arm-linux-gnueabihf-g++ --flags="-m${{ matrix.mode }}" --runner="qemu-arm -L /usr/arm-linux-gnueabihf" --output build/source-tests | tee source-tests.log
      - name: Execute native audio queue, real UDP transport and initializer chain
        shell: bash
        run: |
          set -o pipefail
          python3 android/full-engine/check_platform_backends.py --cxx arm-linux-gnueabihf-g++ --flags="-m${{ matrix.mode }}" --runner="qemu-arm -L /usr/arm-linux-gnueabihf" --output build/platform-tests | tee platform-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: call-abi-${{ matrix.mode }}-execution
          path: |
            call-abi.log
            source-tests.log
            platform-tests.log
            build/platform-tests
            build/source-tests
            build/call-abi
          retention-days: 14
